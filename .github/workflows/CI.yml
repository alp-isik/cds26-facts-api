name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/facts-api:latest \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/facts-api:${GITHUB_SHA::7} \
            .
      - run: docker push --all-tags ${{ secrets.ACR_LOGIN_SERVER }}/facts-api
